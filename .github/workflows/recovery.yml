name: Messenger recovery checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test:dependency-audit
      - run: yarn test:push-unit
      - run: yarn test:recovery-unit
      - run: node --test scripts/roles-feed.test.mjs
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:recovery-browser
      - run: yarn test:app-recovery
      - run: yarn test:push-browser
      - run: yarn test:push-sdk-browser
